services:
  api:
    build: ./backend
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - db
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: routesure
      POSTGRES_USER: routesure
      POSTGRES_PASSWORD: routesure
    ports:
      - "5432:5432"
    volumes:
      - routesure_data:/var/lib/postgresql/data
volumes:
  routesure_data:
